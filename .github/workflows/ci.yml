name: CI - Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint 2>/dev/null || echo "No lint script configured"
        continue-on-error: true

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build backend (if build script exists)
        run: cd backend && npm run build 2>/dev/null || echo "No backend build needed"
        continue-on-error: true

      - name: List production artifacts
        run: |
          echo "=== Frontend dist/ ==="
          ls -lh frontend/dist/ || echo "frontend/dist not found"
          echo ""
          echo "=== Built artifacts ready ==="

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || echo "⚠ Audit found issues - review manually"
        continue-on-error: true
